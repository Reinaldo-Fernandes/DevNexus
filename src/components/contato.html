<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato | DevNexus</title>
  <link rel="stylesheet" href="../style/style.css">
  <link rel="stylesheet" href="../style/static.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <img src="/src/assets/dn.png" alt="Logo DevStar">
      <h1>DevNexus</h1>
    </div>
    <nav class="nav-links">
      <a href="/index.html">Início</a>
      <a href="/src/components/projetos.html">Projetos</a>
      <a href="/src/components/vagas.html">Vagas</a>
      <a href="/src/components/empresa.html">Empresa</a>
      <a href="/src/components/login.html">Entrar</a>
      <a href="/src/components/perfil.html" class="perfil-link">Perfil</a>
    </nav>
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
  </header>

  <main class="static-container">
    <h2>Fale com a gente</h2>
    <p>Dúvidas, sugestões ou parcerias — manda uma mensagem.</p>

    <form id="form-contato" class="contato-form">
      <label for="c-nome">Nome</label>
      <input type="text" id="c-nome" required>

      <label for="c-email">E-mail</label>
      <input type="email" id="c-email" required>

      <label for="c-mensagem">Mensagem</label>
      <textarea id="c-mensagem" rows="5" required></textarea>

      <button type="submit" class="btn-primary" style="justify-self:start;">Enviar</button>
    </form>

    <p id="contato-sucesso" style="display:none; color: var(--color-accent-light); margin-top:1.5rem;">
      Mensagem enviada! A gente responde o quanto antes.
    </p>
  </main>

  <footer>
    <p>© 2025 DevNexus — Feito por jovens devs, para jovens devs.</p>
    <div class="footer-links">
      <a href="sobre.html">Sobre</a>
      <a href="politica.html">Privacidade</a>
      <a href="contato.html">Contato</a>
    </div>
  </footer>

  <script src="../js/db.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/contato.js"></script>
</body>
</html>
